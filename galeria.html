<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería Oficial</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#000;
font-family:Arial,Helvetica,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:#fff;
padding:20px;
}
.viewer{
width:100%;
max-width:760px;
height:90vh;
background:#111;
border-radius:24px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 0 35px rgba(0,0,0,.7);
}
header{
padding:18px;
text-align:center;
font-size:clamp(1.4rem,2vw,2rem);
font-weight:bold;
border-bottom:1px solid #333;
}
.title{
padding:14px;
text-align:center;
font-size:clamp(1.1rem,2vw,1.5rem);
}
.frame{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
background:#000;
}
.frame img{
width:100%;
height:100%;
object-fit:contain;
object-position:center;
display:block;
}
.controls{
display:flex;
justify-content:center;
gap:20px;
padding:15px;
}
button{
width:58px;
height:58px;
border:none;
border-radius:50%;
background:#222;
color:#fff;
font-size:28px;
cursor:pointer;
}
button:hover{background:#333}
#dots{
text-align:center;
font-size:24px;
letter-spacing:5px;
padding-bottom:10px;
}
.back{
display:block;
margin:0 20px 20px;
padding:14px;
text-align:center;
background:#18a83b;
color:#fff;
text-decoration:none;
border-radius:12px;
font-weight:bold;
}
@media(max-width:768px){
body{padding:0}
.viewer{
max-width:100%;
height:100vh;
border-radius:0;
}
.frame{padding:10px}
button{
width:52px;
height:52px;
font-size:24px;
}
}
</style>
</head>
<body>
<div class="viewer">
<header>📸 Galería Oficial</header>
<div class="title" id="titulo"></div>
<div class="frame">
<img id="foto" src="" alt="">
</div>
<div class="controls">
<button onclick="prev()">◀</button>
<button onclick="next()">▶</button>
</div>
<div id="dots"></div>
<a class="back" href="index.html">⬅ Volver al inicio</a>
</div>

<script>
const fotos=[
["viejarobamonedas.jpg","Vieja Robamonedas"],
["golosas esperando postre.jpeg","Golosas Esperando Postre"],
["curiosito.JPG","Curiosito"],
["awelawako.JPG","Awela Wako"],
["pelaopasivo.JPG","Pelao Pasivo"],
["watona insasiable.jpg","Watona Insasiable"],
["jovencita cachetona.png","Jovencita Cachetona"],
["enanagolosa.jpg","Enana Golosa"],
["cachondas.JPG","Cachondas"]
];

let i=0;
const img=document.getElementById("foto");
const title=document.getElementById("titulo");
const dots=document.getElementById("dots");

function render(){
 img.src=fotos[i][0];
 title.textContent=fotos[i][1];
 dots.textContent=fotos.map((_,n)=>n===i?"●":"○").join(" ");
}
function next(){i=(i+1)%fotos.length;render();}
function prev(){i=(i-1+fotos.length)%fotos.length;render();}

let startX=0;
document.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
document.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].clientX-startX;
 if(dx<-60)next();
 if(dx>60)prev();
});

render();
</script>
</body>
</html>
