<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería Oficial</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#0a0a0a;
font-family:Arial,Helvetica,sans-serif;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}
.viewer{
width:min(100%,1000px);
height:min(94vh,900px);
background:#171717;
border-radius:22px;
display:grid;
grid-template-rows:auto 1fr auto auto auto;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,.55);
}
header{
padding:20px;
text-align:center;
font-size:clamp(24px,3vw,38px);
font-weight:700;
border-bottom:1px solid #2f2f2f;
}
.stage{
position:relative;
display:flex;
justify-content:center;
align-items:center;
padding:24px;
}
.frame{
width:100%;
max-width:820px;
height:100%;
max-height:620px;
background:#000;
border-radius:18px;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}
.frame img{
width:100%;
height:100%;
object-fit:contain;
object-position:center;
background:#000;
}
.nav{
position:absolute;
top:50%;
transform:translateY(-50%);
width:56px;height:56px;
border:none;
border-radius:50%;
background:rgba(0,0,0,.55);
color:#fff;
font-size:28px;
cursor:pointer;
}
.prev{left:35px}
.next{right:35px}
.caption{
padding:14px;
text-align:center;
font-size:clamp(20px,2vw,30px);
font-weight:700;
}
.dots{
text-align:center;
font-size:18px;
letter-spacing:8px;
padding-bottom:10px;
}
.back{
margin:0 20px 20px;
padding:14px;
background:#1fa94b;
color:#fff;
text-decoration:none;
text-align:center;
border-radius:12px;
font-weight:bold;
}
@media(max-width:768px){
body{padding:0}
.viewer{
height:100vh;
border-radius:0;
}
.stage{padding:12px}
.frame{
height:68vh;
max-height:none;
}
.nav{
width:46px;height:46px;font-size:22px;
}
.prev{left:12px}
.next{right:12px}
.caption{padding:10px}
}
</style>
</head>
<body>
<div class="viewer">
<header>📸 Galería Oficial</header>
<div class="stage">
<button class="nav prev" onclick="prev()">❮</button>
<div class="frame">
<img id="img">
</div>
<button class="nav next" onclick="next()">❯</button>
</div>
<div class="caption" id="title"></div>
<div class="dots" id="dots"></div>
<a class="back" href="index.html">⬅ Volver al inicio</a>
</div>

<script>
const fotos=[
["viejarobamonedas.jpg","Vieja Robamonedas"],
["golosas esperando postre.jpeg","Golosas Esperando Postre"],
["curiosito.JPG","Curiosito"],
["awelawako.JPG","Awela Wako"],
["pelaopasivo.JPG","Pelao Pasivo"],
["watona insasiable.jpg","Watona Insasiable"],
["jovencita cachetona.png","Jovencita Cachetona"],
["enanagolosa.jpg","Enana Golosa"],
["cachondas.JPG","Cachondas"]
];
let i=0;
const img=document.getElementById("img");
const title=document.getElementById("title");
const dots=document.getElementById("dots");
function render(){
img.src=fotos[i][0];
title.textContent=fotos[i][1];
dots.innerHTML=fotos.map((_,n)=>`<span style="opacity:${n===i?1:.35}">●</span>`).join(" ");
}
function next(){i=(i+1)%fotos.length;render();}
function prev(){i=(i-1+fotos.length)%fotos.length;render();}
let sx=0;
document.addEventListener("touchstart",e=>sx=e.touches[0].clientX);
document.addEventListener("touchend",e=>{
let dx=e.changedTouches[0].clientX-sx;
if(dx<-60)next();
if(dx>60)prev();
});
document.addEventListener("keydown",e=>{
if(e.key==="ArrowRight")next();
if(e.key==="ArrowLeft")prev();
});
render();
</script>
</body>
</html>
