<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Galería Responsive</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#0b0b0b;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:#fff;
}
.viewer{
width:100%;
max-width:900px;
height:min(92vh,900px);
background:#151515;
border-radius:22px;
display:flex;
flex-direction:column;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,.6);
}
header{padding:18px;text-align:center;font-size:clamp(22px,3vw,34px);font-weight:bold}
.title{padding:10px;text-align:center;font-size:clamp(18px,2vw,26px)}
.frame{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:#000;
}
.image-box{
width:100%;
height:100%;
max-width:700px;
aspect-ratio:4/5;
display:flex;
justify-content:center;
align-items:center;
background:#111;
border-radius:18px;
overflow:hidden;
}
.image-box img{
width:100%;
height:100%;
object-fit:cover;
object-position:center;
display:block;
}
.controls{
display:flex;
justify-content:center;
gap:18px;
padding:16px;
}
button{
width:58px;height:58px;
border:none;border-radius:50%;
font-size:28px;
cursor:pointer;
}
#dots{text-align:center;font-size:24px;padding-bottom:14px;letter-spacing:5px}
.back{
margin:0 20px 20px;
padding:14px;
background:#1ea84b;
color:#fff;
text-decoration:none;
text-align:center;
border-radius:12px;
font-weight:bold;
}
@media (max-width:768px){
body{padding:0}
.viewer{
height:100vh;
max-width:none;
border-radius:0;
}
.frame{padding:10px}
.image-box{
width:95%;
aspect-ratio:4/5;
}
button{width:52px;height:52px;font-size:24px}
}
</style>
</head>
<body>
<div class="viewer">
<header>📸 Galería Oficial</header>
<div class="title" id="title"></div>
<div class="frame">
<div class="image-box">
<img id="img" src="" alt="">
</div>
</div>
<div class="controls">
<button onclick="prev()">◀</button>
<button onclick="next()">▶</button>
</div>
<div id="dots"></div>
<a class="back" href="index.html">⬅ Volver al inicio</a>
</div>
<script>
const fotos=[
["viejarobamonedas.jpg","Vieja Robamonedas"],
["golosas esperando postre.jpeg","Golosas Esperando Postre"],
["curiosito.JPG","Curiosito"],
["awelawako.JPG","Awela Wako"],
["pelaopasivo.JPG","Pelao Pasivo"],
["watona insasiable.jpg","Watona Insasiable"],
["jovencita cachetona.png","Jovencita Cachetona"],
["enanagolosa.jpg","Enana Golosa"],
["cachondas.JPG","Cachondas"]
];
let i=0;
const img=document.getElementById("img");
const title=document.getElementById("title");
const dots=document.getElementById("dots");
function render(){
 img.src=fotos[i][0];
 title.textContent=fotos[i][1];
 dots.textContent=fotos.map((_,n)=>n===i?"●":"○").join(" ");
}
function next(){i=(i+1)%fotos.length;render();}
function prev(){i=(i-1+fotos.length)%fotos.length;render();}
let sx=0;
document.addEventListener("touchstart",e=>sx=e.touches[0].clientX);
document.addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].clientX-sx;
 if(dx<-60)next();
 if(dx>60)prev();
});
render();
</script>
</body>
</html>
