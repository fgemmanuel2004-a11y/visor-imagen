<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Galería</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:#000;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}
.viewer{
width:100%;
max-width:430px;
height:100vh;
display:flex;
flex-direction:column;
background:#111;
}
.header{
padding:16px;
font-size:20px;
font-weight:bold;
border-bottom:1px solid #222;
text-align:center;
}
.image-wrap{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:10px;
}
.image-wrap img{
max-width:100%;
max-height:100%;
border-radius:14px;
transition:opacity .3s ease;
box-shadow:0 0 20px rgba(255,255,255,.12);
}
.footer{
padding:14px;
}
.title{
font-size:20px;
font-weight:bold;
margin-bottom:12px;
text-align:center;
}
.actions{
display:flex;
justify-content:center;
gap:18px;
font-size:28px;
margin-bottom:14px;
}
.controls{
display:flex;
justify-content:space-between;
align-items:center;
}
button{
background:#222;
color:#fff;
border:none;
padding:12px 18px;
border-radius:12px;
font-size:18px;
cursor:pointer;
}
button:hover{background:#333}
.dots{
text-align:center;
font-size:18px;
letter-spacing:5px;
margin-top:12px;
}
.back{
display:block;
margin-top:15px;
text-align:center;
color:#8ab4ff;
text-decoration:none;
}
</style>
</head>
<body>

<div class="viewer">
<div class="header">Galería Oficial</div>

<div class="image-wrap">
<img id="foto" src="" alt="">
</div>

<div class="footer">
<div class="title" id="titulo"></div>

<div class="actions">
<span>♡</span>
<span>💬</span>
<span>↗</span>
</div>

<div class="controls">
<button onclick="anterior()">◀</button>
<button onclick="siguiente()">▶</button>
</div>

<div class="dots" id="dots"></div>

<a class="back" href="index.html">⬅ Volver al inicio</a>

</div>
</div>

<script>
const items=[
{img:"viejarobamonedas.jpg",titulo:"Vieja Robamonedas"},
{img:"golosas esperando postre.JPG",titulo:"Golosas Esperando Postre"},
{img:"curiosito.JPG",titulo:"Curiosito"},
{img:"awelawako.JPG",titulo:"Awela Wako"},
{img:"pelaopasivo.JPG",titulo:"Pelao Pasivo"},
{img:"watona insasiable.jpg",titulo:"Watona Insasiable"},
{img:"jovencita cachetona.png",titulo:"Jovencita Cachetona"},
{img:"chanchitagolosa.jpg",titulo:"Chanchita Golosa"},
{img:"curiosa buscando fierro.jpg",titulo:"Curiosa Buscando Fierro"}
];
let i=0;
const img=document.getElementById("foto");
const title=document.getElementById("titulo");
const dots=document.getElementById("dots");

function render(){
img.style.opacity=0;
setTimeout(()=>{
 img.src=items[i].img;
 title.textContent=items[i].titulo;
 let s="";
 for(let j=0;j<items.length;j++) s+=j===i?"● ":"○ ";
 dots.textContent=s;
 img.style.opacity=1;
},150);
}
function siguiente(){i=(i+1)%items.length;render();}
function anterior(){i=(i-1+items.length)%items.length;render();}

let start=0;
document.addEventListener("touchstart",e=>start=e.touches[0].clientX);
document.addEventListener("touchend",e=>{
let end=e.changedTouches[0].clientX;
if(start-end>50)siguiente();
if(end-start>50)anterior();
});

render();
</script>

</body>
</html>
