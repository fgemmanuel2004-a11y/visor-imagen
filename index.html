<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>👑 Benja Dictador 👑</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0d0d0d,#1b1b1b,#000000);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* Fondo animado */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.08), transparent 20%),
    radial-gradient(circle at 80% 30%, rgba(255,255,255,.06), transparent 18%),
    radial-gradient(circle at 50% 80%, rgba(255,255,255,.05), transparent 25%);
    animation:fondo 10s linear infinite alternate;
}

@keyframes fondo{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.2);
    }
}

.contenedor{
    position:relative;
    z-index:1;
    width:92%;
    max-width:850px;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:35px;
    text-align:center;
    box-shadow:0 0 40px rgba(0,0,0,.7);
    animation:entrada 1s ease;
}

@keyframes entrada{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

h1{

    color:white;
    font-size:42px;
    text-shadow:
    0 0 10px white,
    0 0 20px white;

}

p{

    color:#cfcfcf;
    margin-top:12px;
    margin-bottom:25px;
    font-size:18px;

}

img{

    width:100%;
    max-width:650px;
    border-radius:18px;
    transition:.4s;
    box-shadow:
    0 0 25px rgba(255,255,255,.15);

}

img:hover{

    transform:scale(1.04);

    box-shadow:
    0 0 45px rgba(255,255,255,.35);

}

footer{

    margin-top:25px;
    color:#999;
    font-size:14px;

}

</style>

</head>

<body>

<div class="contenedor">

<h1>👑 Benja Dictador 👑</h1>

<p>Galería Oficial</p>

<img src="benjadictador.png.JPG" alt="Benja Dictador">

<footer>
Creado con GitHub Pages
</footer>

</div>

</body>
</html
